name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - legacy-intel

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Run canonical checks
        run: nix develop --no-update-lock-file --command just check
