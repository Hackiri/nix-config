name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - legacy-intel

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run canonical checks once on Linux
        if: runner.os == 'Linux'
        run: nix develop --no-update-lock-file --command just check

      - name: Run native flake checks on macOS
        if: runner.os == 'macOS'
        run: nix flake check --no-update-lock-file --print-build-logs
