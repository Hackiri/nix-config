name: Update flake inputs

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake inputs
        run: nix flake update

      - name: Validate updated inputs
        run: nix develop --no-update-lock-file --command just check

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            Automated weekly flake input update.

            Validation: `just check`.

            For a targeted update, run `nix flake update nixpkgs` with the
            required input name.
          branch: flake-update
          delete-branch: true
