name: Update flake inputs

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Update flake inputs
        run: nix flake update

      - name: Validate updated inputs
        run: nix develop --no-update-lock-file --command just check

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            Automated weekly flake input update.

            Validation: `just check`.

            For a targeted update, run `nix flake update nixpkgs` with the
            required input name.
          branch: flake-update
          delete-branch: true
